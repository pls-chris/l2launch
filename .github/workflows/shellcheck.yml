name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning l2launch.sh
      - name: smoke test
        run: |
          bash l2launch.sh --version
          bash l2launch.sh --help > /dev/null
